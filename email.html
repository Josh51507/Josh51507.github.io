<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="style.css">

<body>
  <header>
    <h1 class="starter-heading"><em><strong>Contact</strong></em></h1>
  </header>

  <nav class="menu-buttons" aria-label="Main">
    <a href="index.html" class="home">Home</a>
    <a href="social.html" class="social">Social</a>
    <a href="email.html" class="email" aria-current="page">Contact</a>
  </nav>

  <main>
    <form class="contact-form" action="https://formsubmit.co/Joshya515072@gmail.com" method="POST">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>
      <button type="submit" class="send">Send!</button>

      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://josh51507.github.io/">
      <input type="hidden" name="_subject" value="New message from my website">
      <input type="text" name="_honey" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>
  </main>
</body>
</html>
